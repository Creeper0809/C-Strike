server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
