# =====================================================================
# C-STRIKE 2026 — 스코어보드 서버 블록 (공개, :443 HTTPS)
# 참가자/관전자 누구나 접근 가능. 읽기 전용.
#
# 내부 구성 (2026-04-11 통합 이후):
#   - scoreboard 컨테이너(Python+FastAPI+WebSocket) ← 메인 UI + 폴링 + 브로드캐스트
#   - ops-backend ← 운영 포털 공개 API (/api/v1/scoreboard/*)
# =====================================================================

# WebSocket Upgrade 매핑 (http → ws)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name scoreboard.cstrike.local _;
    resolver 127.0.0.11 valid=30s ipv6=off;

    set $scoreboard_upstream  http://scoreboard:8000;
    set $ops_backend_upstream http://ops-backend:8400;

    # ── SSL 설정 ──
    ssl_certificate     /etc/nginx/ssl/scoreboard.crt;
    ssl_certificate_key /etc/nginx/ssl/scoreboard.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_scoreboard:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── CSP (Chart.js CDN + WebSocket 허용) ──
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss: ws:" always;

    # ── WebSocket 엔드포인트 (/ws) — scoreboard 컨테이너로 Upgrade ──
    location = /ws {
        proxy_pass $scoreboard_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 장기 연결 허용 (기본 60s → 24h)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── 정적 자산 (/static/*) — scoreboard 컨테이너의 FastAPI StaticFiles ──
    location /static/ {
        proxy_pass $scoreboard_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 정적 자산 짧은 캐시
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # ── REST fallback (/api/state, /api/health) — scoreboard 컨테이너 ──
    location ~ ^/api/(state|health)$ {
        proxy_pass $scoreboard_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        limit_req zone=scoreboard_zone burst=20 nodelay;
    }

    # ── 운영 포털 공개 스코어보드 API — ops-backend 직접 프록시 ──
    # scoreboard 컨테이너를 우회해 참가자/관전자가 원시 데이터를 직접 받을 수 있다.
    location /api/v1/scoreboard/ {
        proxy_pass $ops_backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nginx 레벨 캐싱 (API 응답 10초)
        proxy_cache scoreboard_cache;
        proxy_cache_valid 200 10s;
        proxy_cache_valid 304 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;

        limit_req zone=scoreboard_zone burst=20 nodelay;
    }

    # ── 기타 운영 API 완전 차단 ──
    # /api/v1/scoreboard/, /api/state, /api/health 외의 /api/* 는 403.
    location /api/ {
        return 403;
    }

    # ── 그 외 모든 경로 (루트 HTML 등) → scoreboard 컨테이너 ──
    location / {
        proxy_pass $scoreboard_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=scoreboard_zone burst=20 nodelay;
    }
}
