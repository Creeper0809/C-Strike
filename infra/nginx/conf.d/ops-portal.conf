# =====================================================================
# C-STRIKE 2026 — 운영 포털 서버 블록 (관리자 전용, :8443 HTTPS)
# 참가자 네트워크(10.10.0.0/16)에서 접근 차단.
# 운영 VPN(10.20.0.0/16), 물리 LAN(192.168.100.0/24)만 허용.
# =====================================================================

server {
    listen 8443 ssl;
    http2 on;
    server_name ops.cstrike.local;

    # HTTP→HTTPS 리다이렉트 (http://로 8443 접근 시 400 방지)
    error_page 497 =301 https://$host:$server_port$request_uri;

    # ── SSL 설정 ──
    ssl_certificate     /etc/nginx/ssl/ops-portal.crt;
    ssl_certificate_key /etc/nginx/ssl/ops-portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_ops:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── 참가자 네트워크 차단 (Nginx 레벨) ──
    # iptables와 이중 보호 — 만약 iptables 우회 시에도 Nginx에서 차단
    deny 10.10.0.0/16;
    allow 10.20.0.0/16;       # 운영 VPN
    allow 192.168.100.0/24;   # 물리 LAN
    allow 127.0.0.1;          # localhost
    allow 172.16.0.0/12;      # Docker 내부 네트워크
    deny all;                 # 그 외 전부 차단

    # ── Next.js 프론트엔드 ──
    location / {
        proxy_pass http://ops-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ops_zone burst=50 nodelay;
    }

    # ── Next.js 정적 에셋 ──
    location /_next/ {
        proxy_pass http://ops-frontend:3000;
        proxy_set_header Host $host;
        expires 1d;
    }

    # ── WebSocket (실시간 이벤트) — /api/ws/* 전용 Upgrade 프록시 ──
    # 프론트 useOpsWebSocket 훅은 /api/ws/events 로 접속한다.
    # nginx는 가장 긴 prefix를 선택하므로 /api/ws/ 가 /api/ 보다 우선 매칭된다.
    location /api/ws/ {
        proxy_pass http://ops-backend:8400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 타임아웃 (기본 60초 → 300초)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── FastAPI 백엔드 API ──
    location /api/ {
        proxy_pass http://ops-backend:8400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ops_zone burst=50 nodelay;

        # 큰 요청 허용 (파일 업로드 등)
        client_max_body_size 50m;

        # 장시간 요청 허용 — Dockerfile 빌드는 이미지 크기/pip 설치량에 따라
        # 수분 걸릴 수 있음. nginx 기본 60초면 조기 504 차단.
        # 순서: nginx(900s) > ops-backend httpx(600s) > deploy-service BUILD_TIMEOUT(300s).
        proxy_connect_timeout 60s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
        send_timeout          900s;
    }

    # ── WebSocket (실시간 이벤트) ──
    location /ws/ {
        proxy_pass http://ops-backend:8400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 타임아웃 (기본 60초 → 300초)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
