<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-STRIKE 2026 스코어보드</title>
    <link rel="stylesheet" href="/static/css/scoreboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- ══════════ Header ══════════ -->
    <header>
        <div class="header-title">C-STRIKE 2026</div>
        <div class="header-center">
            <div class="round-badge" id="roundBadge">ROUND 0</div>
            <div class="live-badge" id="liveIndicator">
                <div class="live-dot"></div>
                실시간
            </div>
            <div class="frozen-badge" id="frozenBadge">
                &#10052; 스코어보드 동결
            </div>
        </div>
        <div class="header-right">
            <div class="clock" id="clock"></div>
            <button class="btn-fullscreen" id="btnFullscreen" title="전체화면">&#x26F6; 전체화면</button>
            <button class="btn-theme" id="btnTheme" title="테마 전환">&#9788; 다크</button>
        </div>
    </header>

    <!-- ══════════ Vulnpack Bar ══════════ -->
    <div class="vulnpack-bar" id="vulnpackBar"></div>

    <!-- ══════════ Tab Navigation ══════════ -->
    <div class="nav-tabs">
        <div class="nav-tab active" data-tab="tabRanking">팀 순위</div>
        <div class="nav-tab" data-tab="tabMatrix">공격 / 방어</div>
        <div class="nav-tab" data-tab="tabBonus">보너스 존</div>
    </div>

    <!-- ══════════ Tab: Rankings ══════════ -->
    <div id="tabRanking" class="tab-content active">
        <div class="container">
            <div class="grid-2">
                <!-- Rankings Table -->
                <div class="panel grid-full" style="position:relative;">
                    <div class="panel-title">팀 순위</div>
                    <div class="frozen-overlay" id="frozenOverlay">
                        <div class="frozen-text">&#10052; 동결 &#10052;</div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th style="width:45px">#</th>
                                <th>팀</th>
                                <th>공격</th>
                                <th>방어</th>
                                <th>보너스</th>
                                <th>합계</th>
                            </tr>
                        </thead>
                        <tbody id="scoreboardBody"></tbody>
                    </table>
                </div>

                <!-- Trend Chart -->
                <div class="panel grid-full">
                    <div class="panel-title">점수 추이</div>
                    <div class="chart-container">
                        <canvas id="trendCanvas"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ══════════ Tab: Attack / Defense ══════════ -->
    <div id="tabMatrix" class="tab-content">
        <div class="container">
            <div class="grid-2">
                <!-- Attack Matrix -->
                <div class="panel grid-full">
                    <div class="panel-title">공격 매트릭스 (히트맵)</div>
                    <div class="matrix-filters" id="matrixFilters"></div>
                    <div id="matrixContainer"></div>
                </div>

                <!-- Defense Stats -->
                <div class="panel grid-full">
                    <div class="panel-title">팀별 방어율</div>
                    <div class="defense-grid" id="defenseGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ══════════ Tab: Bonus Zone ══════════ -->
    <div id="tabBonus" class="tab-content">
        <div class="container">
            <div class="panel">
                <div class="panel-title bonus-title">보너스 존 - 동적 배점</div>
                <p style="color:var(--text-muted);font-size:0.82rem;padding:0 16px 8px;">먼저 풀수록 높은 점수!</p>
                <div class="bonus-card-grid" id="bonusSummary"></div>
            </div>

            <div class="panel" style="margin-top:24px;">
                <div class="panel-title bonus-title">보너스 존 순위</div>
                <table>
                    <thead>
                        <tr>
                            <th style="width:45px">#</th>
                            <th>팀</th>
                            <th>풀이 수</th>
                            <th>보너스 점수</th>
                        </tr>
                    </thead>
                    <tbody id="bonusLeaderboard"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/static/js/scoreboard.js"></script>
</body>
</html>
